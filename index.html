var RoomCore=(()=>{
  const catalog=typeof MISSION_DATA!=='undefined'?MISSION_DATA:require('./missions.json');
  const CUSTOMERS=catalog.customers,TASKS=catalog.tasks;
  const INITIAL={version:3,stress:18,paper:20,prints:0,teaCooldown:0,attempts:0,server:'offline',usbScanned:false,consoleModel:'PS4',consoleChecked:false,visited:[],order:{index:0,mission:0,step:0,line:0,earnings:0,retries:0,completed:[]}};
  const places=['monitor','printer','tea','shelf','papers','door'];
  const integer=(n,min,max)=>Number.isInteger(n)&&n>=min&&n<=max;
  class Room{
    constructor(saved){
      this.state=JSON.parse(JSON.stringify(INITIAL));this.started=false;this.paused=false;this.job=null;
      if(!saved)return;
      const d=typeof saved==='string'?JSON.parse(saved):saved;
      if(!d||![1,2,3].includes(d.version)||!Number.isFinite(d.stress)||d.stress<0||d.stress>100||!integer(d.paper,0,99)||!integer(d.prints,0,1e9)||!Number.isFinite(d.teaCooldown)||d.teaCooldown<0||!integer(d.attempts,0,1e9)||!['offline','online'].includes(d.server)||!['PS3','PS4'].includes(d.consoleModel)||!Array.isArray(d.visited)||d.visited.some(p=>!places.includes(p)))throw Error('Invalid equipment save');
      for(const k of Object.keys(INITIAL))if(!['order','version'].includes(k)&&k in d)this.state[k]=d[k];
      let q;
      if(d.version===3){
        q=d.order;
        if(!q||!integer(q.index,0,5)||!integer(q.mission,0,2)||!integer(q.step,0,5)||!integer(q.line,0,2)||!integer(q.earnings,0,1e9)||!integer(q.retries,0,3)||!Array.isArray(q.completed)||new Set(q.completed).size!==q.completed.length||q.completed.some(k=>!CUSTOMERS.some(c=>[0,1,2].some(m=>k===c.id+':'+m))))throw Error('Invalid campaign save');
        if(q.index===5&&(q.step!==0||q.completed.length!==15))throw Error('Invalid completed campaign');
        if(q.index<5&&((q.step===5)!==q.completed.includes(CUSTOMERS[q.index].id+':'+q.mission)))throw Error('Invalid paid order');
        this.state.order=JSON.parse(JSON.stringify(q));
      }else if(d.version===2){
        q=d.order;
        if(!q||!integer(q.index,0,2)||!integer(q.step,0,5)||!integer(q.earnings,0,1e9)||!integer(q.retries,0,3))throw Error('Invalid legacy order');
        const completed=[];
        if(q.index>0||(q.index===0&&q.step===5))completed.push('man:0');
        if(q.index>1||(q.index===1&&q.step===5))completed.push('woman:0');
        this.state.order={...this.state.order,index:q.index>1?0:q.index,mission:q.index>1?1:0,step:q.index>1?0:q.step,earnings:q.earnings,retries:q.index>1?0:q.retries,completed};
      }
      if(d.activeJob){
        const j={...d.activeJob},durations={retry:2.5,print:1.8,scan:2,console:2};
        if(d.version===2&&['recover','order_retry','order_print'].includes(j.kind)){j.kind='work';j.task=this.taskId();}
        const expected=j.kind==='work'?this.task()?.duration:durations[j.kind];
        if(!expected||j.duration!==expected||!Number.isFinite(j.elapsed)||j.elapsed<0||j.elapsed>=expected||(j.kind==='work'&&(j.task!==this.taskId()||this.task()?.kind==='choice')))throw Error('Invalid job save');
        this.job={kind:j.kind,duration:j.duration,elapsed:j.elapsed,...(j.kind==='work'?{task:j.task}:{})};
      }
    }
    customer(){return CUSTOMERS[this.state.order.index]||null;}
    mission(){return this.customer()?.missions[this.state.order.mission]||null;}
    taskId(){return this.mission()?.tasks[this.state.order.step-1]||null;}
    task(){return TASKS[this.taskId()]||null;}
    start(){this.started=true;this.paused=false;}
    ready(){return this.started&&!this.paused;}
    advance(){this.state.order.step++;this.state.order.line=0;this.state.order.retries=0;}
    dialogueNext(){if(!this.ready()||this.state.order.index===5)return false;const q=this.state.order;const limit=q.step===0?2:q.step===5?1:0;if(q.line>=limit)return false;q.line++;return true;}
    orderAction(action){
      if(!this.ready()||this.job||!this.mission())return null;
      const q=this.state.order,t=this.task();
      if(action==='accept'&&q.step===0){this.advance();return 'order_accepted';}
      if(action==='deliver'&&q.step===4){const key=this.customer().id+':'+q.mission;if(q.completed.includes(key))return null;q.completed.push(key);q.earnings+=this.mission().reward;this.advance();return 'mission_delivered';}
      if(action==='next'&&q.step===5){
        for(let c=0;c<CUSTOMERS.length;c++)for(let m=0;m<3;m++)if(!q.completed.includes(CUSTOMERS[c].id+':'+m)){q.index=c;q.mission=m;q.step=0;q.line=0;q.retries=0;return 'new_order';}

  <script>(() => {

    try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
    catch(_){say('fullscreen_failed');}
  });
  document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=text(document.fullscreenElement?'exit_fullscreen':'fullscreen');});
  document.addEventListener('keydown',event=>{
    if(event.repeat||event.ctrlKey||event.altKey||event.metaKey)return;
    if(!room.started){if(event.key==='Enter'&&document.activeElement===document.body){event.preventDefault();beginGame();}return;}
    if($('panel').open)return;
    if(event.key==='Escape'){event.preventDefault();openPanel('pause');return;}
    if(event.code==='KeyH'){event.preventDefault();toggleHints();return;}
    const index=['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6'].indexOf(event.code);
    if(index>=0){event.preventDefault();visit(['monitor','printer','tea','shelf','papers','door'][index]);}
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&room.started&&!room.paused){if(panel)closePanel();openPanel('pause');save();}
    updateAudio();lastTime=performance.now();
  });
  window.addEventListener('pagehide',save);
  function frame(now){
    const dt=Math.min(.25,Math.max(0,(now-lastTime)/1000));lastTime=now;
    const result=room.tick(dt);if(result){$('printer-paper').classList.remove('printing');say(result);beep(result==='server_error'?'error':'click');renderPanel();renderHUD();save();}
    if(room.started&&!room.paused&&speechTime>0){speechTime-=dt;if(speechTime<=0)$('speech').hidden=true;}
    elapsed+=dt;if(elapsed>.1){elapsed=0;renderHUD();}
    requestAnimationFrame(frame);
  }
  document.documentElement.style.setProperty('--scene-image',`url("${$('shop-image').src}")`);
  translate();$('save-warning').hidden=storageOK;requestAnimationFrame(frame);
})();
</script>
</body>
</html>
