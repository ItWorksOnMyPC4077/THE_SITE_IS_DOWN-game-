.copy-screen .progress-track i{display:block;height:100%;background:#9fb180;width:0}.seized-screen{background:#070909;border:1px solid #ab4d4d;color:#ff7474;padding:28px;text-align:center;line-height:2;font-size:18px;margin:25px 0}
.ending-good .ending-art{background:radial-gradient(ellipse,#dacb8f44,transparent 70%)}

/* Keep the longer Zeus title readable at small viewport sizes. */
.intro h1 strong{font-size:clamp(30px,5.2vw,54px);line-height:1.65;letter-spacing:0;overflow-wrap:anywhere}

@media(max-height:540px){.intro h1 strong,html[dir=ltr] .intro h1 strong{font-size:29px;line-height:1.3}.intro-card{max-height:calc(100dvh - 75px);overflow:auto}}
/* Main-menu training uses a separate practice room. */
.tutorial-menu-button{display:flex;margin:12px auto 0;min-height:39px;font-size:12px;border-color:#9d9576;color:#eadbb4}
.tutorial-track{height:5px;background:#0f1710;margin:7px 0 24px;direction:ltr}.tutorial-track i{display:block;height:100%;background:#b5c69b}
.practice-notice{display:block;border-inline-start:2px solid #9aa885;padding:8px 12px;background:#1c291e;color:#a9ba9b;font-size:10px;line-height:1.9;margin-bottom:22px}
.training-customer{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:19px;margin:25px 0}.training-customer img{width:90px;height:120px;object-fit:contain;image-rendering:pixelated}
.training-bubble{border:2px solid #baab89;border-radius:32px;background:#e2ddcc;color:#282b23;padding:22px;font:inherit;font-size:13px;line-height:2;text-align:start;position:relative}.training-bubble:before{content:"";position:absolute;inset-inline-start:-12px;top:40%;width:14px;height:23px;background:#e2ddcc;clip-path:polygon(0 50%,100% 0,100% 100%)}html[dir=rtl] .training-bubble:before{transform:scaleX(-1)}.training-bubble small{display:block;margin-top:9px;color:#786c50;font-size:10px}
.training-station,.training-app-detail{padding:17px;border:1px solid #718463;background:#1c2a1c;margin:20px 0}.training-station>b{color:#d4c395;font-size:13px}.training-feedback{border-inline-start:3px solid #c6a773;padding:10px 14px;background:#353322;color:#e1c597!important}
.training-stress{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px;background:#171e16;margin:15px 0;flex-wrap:wrap}.training-stress .stress-track{flex-basis:100%;width:100%;height:12px}.training-tea{display:flex;align-items:center;justify-content:center;gap:15px;width:100%;padding:24px;font:40px serif;color:#e6d4a6;background:#2f3427;border:1px solid #a2936c}.training-tea span{font:15px Cafe,Tahoma,sans-serif}.training-patience .patience-track{display:block;height:13px;margin:15px 0;direction:ltr}.training-patience .patience-track i{display:block;height:100%;background:#c1ae70}
.training-apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.training-apps .panel-button{font-size:11px;padding:10px 6px}.training-apps [aria-pressed=true]{background:#555b3b;color:#f3e7c8;border-color:#d6bd81}.training-exit{border-top:1px solid #687855;margin-top:25px;padding-top:9px}.tutorial-course h2{color:#e5d6ab}
.dev-toolbar{position:fixed;z-index:6;inset-inline-end:22px;top:86px;background:#15292be8;border:1px solid #6aafaf;padding:9px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 20px #0007;color:#a7d5d1;font-size:10px}.dev-toolbar .quiet-button{font-size:11px;border-color:#82b7b4}.dev-panel-controls{display:flex;justify-content:flex-end;margin-bottom:12px}.dev-panel-controls .panel-button{font-size:10px;min-height:32px;padding:6px 10px;border-color:#5e9290;color:#add3ca}
@media(max-width:540px){.training-customer{grid-template-columns:62px 1fr;gap:14px}.training-customer img{width:62px;height:95px}.training-bubble{padding:17px;font-size:12px;border-radius:26px}.training-apps{grid-template-columns:repeat(2,minmax(0,1fr))}.dev-toolbar{inset-inline-end:10px;top:150px;flex-direction:column;gap:5px;padding:7px;max-width:140px}}

.training-language{float:inline-end;margin-inline-start:12px;margin-bottom:8px}.training-exit{clear:both}

/* User-supplied scenery, story portraits and console bench. */
dialog[data-view=shelf]{width:min(850px,calc(100% - 28px))}
.console-bench.console-cards{position:relative;display:block;width:min(100%,55dvh);aspect-ratio:1;margin:18px auto 24px;direction:ltr;padding:0;gap:0;overflow:hidden;border:1px solid #807c65;background:#121512}
.console-bench>img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.console-hit{position:absolute;top:44%;height:29%;border:2px solid transparent;border-radius:12px;background:transparent;transition:background .15s,border-color .15s}
.console-hit.console-ps3{left:9%;width:38%}.console-hit.console-ps4{left:51%;width:39%}
.console-hit>span{position:absolute;top:7%;left:50%;transform:translateX(-50%);padding:4px 9px;background:#161d18e8;border:1px solid #b6a87d;color:#eee2b9;font:12px monospace}
.console-hit:hover:not(:disabled),.console-hit:focus-visible{background:#d9d4ad18;border-color:#d4bc87}.console-hit.selected{border-color:#bdc596;box-shadow:inset 0 0 18px #b3bd7a22}.console-hit.selected>span:before{content:'✓ ';color:#cbd9ad}
.story-people{display:flex;justify-content:center;align-items:flex-end;gap:18px;padding:12px;margin:12px 0 24px;background:radial-gradient(ellipse at bottom,#64706144,transparent 70%);border-bottom:1px solid #8d957344}
.story-people figure{margin:0;min-width:0;flex:0 1 160px;text-align:center}.story-people img{width:100%;height:190px;object-fit:contain;object-position:bottom;image-rendering:pixelated;filter:drop-shadow(0 5px 8px #0008)}.story-people figcaption{font-size:10px;color:#d7c895;line-height:1.8;padding-top:7px}
.night-stage{height:auto;aspect-ratio:1;max-width:520px;margin:16px auto 22px}.night-stage>img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.night-stage>span{background:#10171de0;padding:8px 12px;border:1px solid #8d967755;text-align:center}
.outdoors .scene{aspect-ratio:1;width:min(100vw,100dvh)}.outdoors .screen-light,.outdoors .tea-steam,.outdoors .printer-paper,.outdoors #tea-cup{display:none!important}
.roster-label{font-size:9px;color:#b5c49b;line-height:1.8}.dossier-person .roster-label{border:1px solid #718261;padding:3px 6px}
@media(max-width:540px){.console-bench.console-cards{width:min(100%,48dvh)}.story-people{gap:8px;padding:8px}.story-people img{height:135px}.story-people figcaption{font-size:9px}}

/* Story is a separate, full-viewport scene; physical sides never follow RTL. */
dialog.story-screen{position:fixed;inset:0;width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;padding:0;border:0;border-radius:0;background:#0b100f;color:#e8e1cf;overflow:auto;box-shadow:none}
dialog.story-screen::backdrop{background:#0b100f}.story-screen>.panel-top{display:none}.story-screen>#panel-content{padding:0;max-width:none}
.story-page-active .topbar,.story-page-active #world,.story-page-active .hud,.story-page-active #order-tracker,.story-page-active #customer-actions,.story-page-active #dev-toolbar,.story-page-active #game-event,.story-page-active .speech{visibility:hidden;pointer-events:none}
.story-page{position:relative;isolation:isolate;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;overflow:hidden;background:#0b100f}
.story-background{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.48) saturate(.6);image-rendering:pixelated}
.story-page:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(#07100be8,transparent 35%,#07100b60 65%,#07100bf5),radial-gradient(ellipse at center,transparent,#02070488);pointer-events:none}
.story-heading{padding:clamp(16px,3vw,36px) clamp(18px,4vw,60px) 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;min-width:0}
.story-heading>div{min-width:0}.story-heading #panel-title{font-size:clamp(18px,2.2vw,30px);margin:8px 0;line-height:1.7;color:#e7d3a1}.story-eyebrow{font-size:11px;letter-spacing:.2px;color:#c2bc9d}
#panel-content .story-heading p{font-size:11px;color:#b8bfa8;line-height:1.8;margin:0}.story-navigation{display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap}.story-navigation .panel-button,.story-navigation .quiet-button{font-size:11px;padding:8px 12px;min-height:36px;margin:0;background:#112018b8}
.story-duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);direction:ltr;gap:clamp(18px,4vw,70px);align-items:end;align-self:center;padding:16px clamp(18px,3vw,50px);width:min(1500px,100%);margin:auto;min-width:0}
.story-actor{display:grid;gap:clamp(9px,1.7vw,26px);align-items:center;min-width:0}.story-actor.opponent{grid-column:1;grid-template-columns:minmax(90px,36%) minmax(0,1fr)}.story-actor.hero{grid-column:2;grid-template-columns:minmax(0,1fr) minmax(90px,36%)}
.story-actor figure{margin:0;min-width:0;text-align:center;direction:initial}.story-actor img{display:block;width:100%;height:clamp(200px,41dvh,470px);object-fit:contain;object-position:bottom;image-rendering:pixelated;filter:drop-shadow(0 10px 18px #000c)}
.story-actor figcaption{font-size:10px;background:#0b1714b8;border:1px solid #c6b47b44;padding:6px;line-height:1.8;color:#d4c69c;margin:6px auto 0;width:fit-content}
.story-bubble{position:relative;display:flex;flex-direction:column;gap:10px;text-align:start;padding:clamp(14px,1.8vw,25px);border:2px solid #b6a47c;border-radius:32px;background:#e0d9c3;color:#272e24;box-shadow:0 8px 25px #0007;min-width:0;line-height:2;align-self:center}
.story-bubble:after{content:"";position:absolute;top:42%;width:18px;height:24px;background:#e0d9c3;pointer-events:none}.opponent .story-bubble:after{left:-17px;clip-path:polygon(0 50%,100% 0,100% 100%)}.hero .story-bubble:after{right:-17px;clip-path:polygon(0 0,100% 50%,0 100%)}
.story-bubble>strong{font-size:11px;font-weight:500;border-bottom:1px solid #80745644;padding-bottom:7px;color:#655b3f}.story-bubble-text{font-size:clamp(12px,1.25vw,17px);overflow-wrap:anywhere}.story-bubble>small{font-size:9px;line-height:1.8;color:#73694c;margin-top:5px}.story-bubble:hover:not(:disabled){background:#f1e8d0;border-color:#dfc785}.story-bubble:hover:not(:disabled):after{background:#f1e8d0}.story-bubble:disabled{opacity:1;cursor:default}
.story-controls{width:min(1120px,100%);margin:0 auto;padding:0 clamp(18px,4vw,48px) max(18px,env(safe-area-inset-bottom));min-width:0}
.story-reading{display:flex;justify-content:center;align-items:center;gap:18px;padding:3px 0 12px;font-size:11px;color:#d2cbae}.story-reading .panel-button{font-size:11px;min-height:34px;padding:7px 14px;margin:0;background:#17241dd9}
.story-controls .night-note{margin:0 0 12px;padding:9px 14px;background:#0a1613e8;border-color:#a39265}.story-controls .night-note strong{font-size:10px}.story-controls .night-note p{margin:3px 0 0!important;font-size:11px!important;line-height:1.9!important}
.story-decisions{padding:12px 18px;border:1px solid #9d93665c;background:#101d16e8;box-shadow:0 6px 25px #0005}.story-decisions .plot-choice{border:0;margin:0;padding:0}.story-decisions .plot-choice h3{font-size:12px;margin:0 0 5px}.story-decisions .plot-choice p{font-size:12px!important;margin:3px 0 8px!important;line-height:1.8!important}.story-decisions .plot-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 6px}.story-decisions .plot-options .panel-button{margin:0;font-size:12px;padding:10px 13px;min-height:44px}
.story-decisions>.panel-button{font-size:11px;min-height:33px;margin:4px 0;padding:7px 12px}.story-decisions>.panel-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;border:0;padding:0}.story-decisions>.panel-buttons .panel-button{margin:0;min-height:39px;font-size:12px}.story-decisions>p{font-size:11px!important;line-height:1.8!important;margin:0 0 9px!important}
.story-records{border-top:1px solid #9b9f6b55;margin-top:15px;padding-top:11px;text-align:start}.story-records>summary{cursor:pointer;color:#b5bca2;font-size:11px;line-height:1.8}.story-records[open]{background:#102019f5;padding:14px}.story-records .story-prologue,.story-records .chapter-opening,.story-records .story-epilogue{font-size:13px!important;line-height:2.1!important}.story-ending-copy{color:#d8d0b9!important}.story-ending.ending-bad .story-heading #panel-title{color:#e6a093}.story-ending.ending-good .story-heading #panel-title{color:#cee2a9}
@media(max-width:800px){.story-heading{gap:12px;padding:16px 18px 0}.story-navigation{max-width:145px;justify-content:flex-end}.story-navigation .quiet-button,.story-navigation .panel-button{font-size:10px;padding:7px}.story-duel{gap:18px;padding:4px 18px}.story-actor.opponent,.story-actor.hero{grid-template-columns:1fr;gap:9px}.story-actor.hero figure{grid-row:1}.story-actor.hero .story-bubble{grid-row:2}.story-actor img{height:clamp(140px,26dvh,240px)}.story-actor figcaption{font-size:9px}.story-bubble{border-radius:23px;padding:14px;gap:7px}.story-bubble:after{top:-16px;width:22px;height:17px}.opponent .story-bubble:after,.hero .story-bubble:after{left:calc(50% - 11px);right:auto;clip-path:polygon(50% 0,100% 100%,0 100%)}.story-bubble-text{font-size:12px}.story-bubble>strong{font-size:9px}.story-bubble>small{font-size:8px}.story-controls{padding:0 18px 18px}.story-decisions{padding:11px}.story-decisions .plot-options{gap:8px}.story-decisions .plot-options .panel-button{font-size:10px;padding:8px;line-height:1.9}.story-page{gap:12px}}
@media(max-width:430px){.story-heading #panel-title{font-size:15px}.story-eyebrow{font-size:9px}.story-heading>div>p{font-size:9px!important}.story-navigation{max-width:99px;gap:6px}.story-duel{gap:12px;padding-inline:12px}.story-bubble{padding:12px;border-radius:20px}.story-bubble-text{font-size:11px}.story-controls{padding-inline:12px}.story-decisions .plot-options{grid-template-columns:1fr}.story-actor img{height:150px}.story-reading{gap:8px;font-size:10px}.story-actor figcaption{font-size:8px}}
@media(max-height:540px) and (min-width:801px){.story-heading{padding-top:10px}.story-heading #panel-title{font-size:18px;margin:3px 0}.story-duel{padding-block:0}.story-actor img{height:190px}.story-page{gap:6px}.story-bubble{padding:14px}.story-bubble-text{font-size:12px}.story-controls .night-note{display:none}.story-controls{padding-bottom:12px}.story-records{margin-top:8px;padding-top:6px}}

.story-seized{padding:12px 16px;margin-bottom:12px;border:1px solid #b76a60;background:#100b0ce8;color:#f1a196;text-align:center;font-size:13px;line-height:1.8}
</style>

<body>
  <div class="ambient-backdrop" aria-hidden="true"></div>
  <main id="world" class="world" aria-label="کافه‌نت">
    <div class="scene" id="scene">
      <img id="shop-image" src="assets/mohit/shop-reference.png" alt="" draggable="false">
      <div class="scene-vignette" aria-hidden="true"></div>
      <div class="screen-light" aria-hidden="true"></div>
      <div class="tea-steam" id="tea-steam" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="printer-paper" id="printer-paper" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <button id="customer-sprite" class="customer-sprite" type="button" hidden><img id="customer-image" alt="" draggable="false"><span id="customer-name"></span></button>
      <div class="hotspots" id="hotspots" inert>
        <button class="hotspot monitor" data-place="monitor" type="button"><span class="target-point"></span><span class="hotspot-label" data-text="monitor"></span></button>
        <button class="hotspot printer" data-place="printer" type="button"><span class="target-point"></span><span class="hotspot-label" data-text="printer"></span></button>
        <button class="hotspot shelf" data-place="shelf" type="button"><span class="target-point"></span><span class="hotspot-label" data-text="shelf"></span></button>
        <button class="hotspot papers" data-place="papers" type="button"><span class="target-point"></span><span class="hotspot-label" data-text="papers"></span></button>
        <button id="tea-cup" class="hotspot tea" data-place="tea" type="button"><span class="target-point"></span><span class="hotspot-label" data-text="drink_tea"></span></button>
      </div>
      <button id="scene-dialogue" class="scene-dialogue" type="button" hidden aria-describedby="scene-dialogue-hint"><span id="scene-dialogue-name" class="scene-dialogue-name"></span><span id="scene-dialogue-line" class="scene-dialogue-line" aria-live="polite" aria-atomic="true"></span><span class="scene-dialogue-bottom"><span id="scene-dialogue-count"></span><span id="scene-dialogue-hint"></span></span></button>
    </div>
  </main>

  <section class="intro" id="intro" aria-labelledby="game-title">
    <div class="intro-card">
      <div class="chapter-label"><span></span><p data-text="intro_eyebrow"></p><span></span></div>
      <h1 id="game-title"><span data-text="title_first"></span><strong data-text="title_second"></strong></h1>
      <p class="english-title" lang="en" dir="ltr">NET NIGHTS / ZEUS</p>
      <p class="intro-line" data-text="intro_line"></p>
      <fieldset id="difficulty-picker" class="difficulty-picker"><legend data-text="difficulty_question"></legend><div class="difficulty-options"><button type="button" data-difficulty="easy" aria-pressed="false" data-text="easy"></button><button type="button" data-difficulty="normal" aria-pressed="false" data-text="normal"></button><button type="button" data-difficulty="hard" aria-pressed="false" data-text="hard"></button></div><p id="difficulty-description"></p></fieldset>
      <button id="start" class="start-button" type="button"><span data-text="start"></span><span aria-hidden="true">←</span></button>
      <button id="open-tutorial" class="quiet-button tutorial-menu-button" type="button" data-text="tutorial"></button>
      <button id="restart-shift" class="quiet-button" type="button" data-text="restart_shift" hidden></button>
      <p class="intro-note" data-text="intro_note"></p>
    </div>
    <div class="intro-bottom"><span data-text="setting"></span><span class="edition" data-text="edition"></span></div>
  </section>

  <header class="topbar">
    <div class="shop-identity" id="shop-identity" hidden><span class="status-dot"></span><div><strong data-text="shop_name"></strong><small id="day-status"></small></div></div>
    <nav class="settings" aria-label="تنظیمات">
      <button id="language" type="button" class="quiet-button" aria-label="Change language">English</button>
      <button id="audio" type="button" class="quiet-button"></button>
      <button id="motion" type="button" class="quiet-button"></button>
      <button id="fullscreen" type="button" class="quiet-button" data-text="fullscreen"></button>
      <button id="pause" type="button" class="quiet-button" data-text="pause" hidden></button>
    </nav>
  </header>
  <button id="order-tracker" class="order-tracker" type="button" hidden><span id="order-label"></span><strong id="order-objective"></strong><small id="order-money"></small><span id="customer-patience" class="customer-patience" hidden><span data-text="patience"></span><b id="patience-number"></b><span id="patience-bar" class="patience-track" role="progressbar" aria-label="مهلت مشتری" aria-valuemin="0" aria-valuemax="60"><i id="patience-fill"></i><span class="patience-half"></span></span></span></button>
  <section id="customer-actions" class="customer-actions" hidden aria-label="سفارش مشتری"><button id="accept-order" type="button" class="panel-button" data-text="accept_order"></button><button id="deliver-order" type="button" class="panel-button" data-text="deliver_order"></button><button id="leave-customer" type="button" class="quiet-button" data-text="leave_customer"></button><span id="visit-status" role="status"></span></section>

  <section id="dev-toolbar" class="dev-toolbar" hidden aria-label="Developer mode"><span data-text="dev_on"></span><button id="dev-skip" class="quiet-button" type="button" data-text="dev_skip"></button></section>

  <section class="speech" id="speech" hidden aria-live="polite" aria-atomic="true"><span class="speaker" data-text="nima"></span><p id="speech-text"></p></section>

  <footer class="hud" id="hud" hidden>
    <div class="vitals"><div class="stress-block"><span data-text="stress"></span><div class="stress-track" role="progressbar" id="stress-bar" aria-valuemin="0" aria-valuemax="100"><i id="stress-fill"></i><span class="stress-threshold" aria-hidden="true"></span></div><b id="stress-number"></b><small id="stress-state"></small></div><span class="hud-divider"></span><span id="paper-count"></span></div>
    <div class="stress-details"><span id="stress-cause"></span><button type="button" id="take-breath" class="quiet-button" data-text="take_breath"></button><button type="button" id="day-board" class="quiet-button" data-text="day_board"></button><button type="button" id="open-upgrades" class="quiet-button" data-text="upgrades"></button><button type="button" id="open-tools" class="quiet-button" data-text="tools"></button></div>
    <button id="copy-cover" type="button" class="quiet-button" hidden></button><div class="hud-actions"><button id="show-hints" class="quiet-button" type="button"><kbd>H</kbd><span data-text="hints"></span></button><button id="guide" class="quiet-button" type="button" data-text="guide"></button><span class="scene-time" dir="ltr">08:03</span></div>
  </footer>

  <dialog id="panel" aria-labelledby="panel-title">
    <div class="panel-top"><span id="panel-caption"></span><button id="close-panel" type="button" aria-label="بستن">×</button></div>
    <div id="panel-content"></div>
  </dialog>
  <div id="game-event" class="game-event" role="status" aria-live="polite" hidden></div>

_copy": "یک سفارش واقعی را قدم‌به‌قدم تمرین می‌کنیم: گفت‌وگو، قبول سفارش، انتخاب برگه، تنظیم پرینتر، چاپ و تحویل. بعد چای، زمان انتظار، ارتقا و برنامه‌های کامپیوتر را یاد می‌گیری.", "tutorial_1_title": "حباب فقط برای حرف است", "tutorial_1_copy": "حباب همیشه کنار عکس مشتری می‌آید. دو بار روی حرف آقای رحیمی کلیک کن. سفارش هنوز قبول نمی‌شود و هیچ ابزاری باز نمی‌شود.", "tutorial_2_title": "حالا سفارش را قبول کن", "tutorial_2_copy": "مشتری دو کپی خوانا از حکم بازنشستگی می‌خواهد. برای شروع کار دکمهٔ مستقل «قبول سفارش» را بزن.", "tutorial_3_title": "برگهٔ درست را پیدا کن", "tutorial_3_copy": "در بازی روی برگه‌های میز یا کلید ۴ بزن. اینجا حکم بازنشستگی را انتخاب کن؛ قبض برق به این سفارش مربوط نیست.", "tutorial_4_title": "پرینتر را آماده کن", "tutorial_4_copy": "در بازی روی پرینتر یا کلید ۲ بزن. این سند کمرنگ است؛ اول کنتراست را زیاد کن تا مشتری نسخهٔ ناخوانا نگیرد.", "tutorial_5_title": "چاپ زمان و کاغذ مصرف می‌کند", "tutorial_5_copy": "دو نسخه چاپ کن و پرشدن نوار را ببین. تا عملیات تمام نشود نمی‌توانی تحویل بدهی. اگر کاغذ کم شد، از برگه‌های میز کاغذ بردار.", "tutorial_6_title": "پول را هنگام تحویل می‌گیری", "tutorial_6_copy": "در بازی پنجرهٔ ابزار را ببند و «تحویل سفارش» را بزن. اینجا هم تحویل بده؛ ۳۰٬۰۰۰ تومان می‌گیری و کمی استرس کم می‌شود. هر سفارش فقط یک بار پرداخت می‌شود.", "tutorial_7_title": "چای و مرز ۵۰٪", "tutorial_7_copy": "برای تمرین استرس را ۶۰٪ گذاشتیم. بالای ۵۰٪ ممکن است بی‌اختیار سوتی بدهی؛ در ۱۰۰٪ کیبورد می‌شکند. روی استکان چای بزن: در متوسط ۱۴ واحد استرس کم می‌شود. بین دو چای ۲۵ ثانیه فاصله است.", "tutorial_8_title": "مشتری فقط یک دقیقه صبر دارد", "tutorial_8_copy": "تایمر از ورود مشتری شروع می‌شود. این دکمه‌ها زمان را فقط در تمرین جلو می‌برند: در ۳۰ ثانیه طعنه و ۱۵ استرس؛ در ۶۰ ثانیه خروج بدون پول. حرف‌زدن و عوض‌کردن مرحله زمان را صفر نمی‌کنند.", "tutorial_9_title": "درآمد را خرج سرعت کن", "tutorial_9_copy": "۳۰٬۰۰۰ تومان تمرینی داری. ارتقای سطح اول سیستم را بخر؛ زمان کار ۲۰٪ کمتر می‌شود. پرینتر هم سه سطح ارتقا دارد. پنجرهٔ ارتقا زمان را متوقف می‌کند.", "tutorial_10_title": "شش برنامهٔ کامپیوتر", "tutorial_10_copy": "کامپیوتر با کلیک یا کلید ۱ باز می‌شود. برنامهٔ مناسب سفارش را انتخاب کن. هر شش برنامه را باز کن؛ بعد به جمع‌بندی برو.", "tutorial_11_title": "برای داستان آماده‌ای", "tutorial_11_copy": "آسان راهنمای فوری و دو مرحله دارد. متوسط و سخت سه مرحله‌اند و اشتباه را فقط موقع تحویل رو می‌کنند: ۲۵ استرس و انجام دوباره، با همان زمان باقی‌مانده. سخت کد چهاررقمی هم می‌خواهد. روزهای ۱ تا ۳ هر مشتری یک مأموریت متفاوت دارد؛ بعد تصمیم‌های شبانه، پایان زئوس را می‌سازند. کپی هارد در فایل‌ها با C پوشانده می‌شود. H جای وسایل را نشان می‌دهد.", "tutorial_app_browser": "مرورگر: فرم‌ها، نوبت‌ها، F5 و خطای ۵۰۲. فیلدهای فرم را از روی شرح مشتری پر کن.", "tutorial_app_files": "فایل‌ها: فقط فایل‌های خواسته‌شده را انتخاب کن؛ نسخهٔ قدیمی و فایل مشکوک را داخل بسته نگذار. کپی آزمایشی و C هم اینجاست.", "tutorial_app_photo": "عکس: قاب ۳×۴، زمینهٔ مناسب و حجم کمتر از ۵۰ کیلوبایت. بعد خروجی بگیر.", "tutorial_app_scanner": "اسکنر: کیفیت و قالب اسکن را مطابق سفارش بگذار؛ خوانابودن سند مهم است.", "tutorial_app_accounts": "حسابداری: ریز مبلغ‌ها را جمع کن و عدد نهایی را خودت وارد کن. ارقام فارسی هم پذیرفته می‌شوند.", "tutorial_app_planner": "دفتر: مشتری‌ها و سه مأموریت هر نفر را ببین. دفتر و گزارش روز زمان را متوقف می‌کنند.", "roster_active": "مشتری این بازی", "roster_other": "در بازی‌های بعدی", "bench_alt": "میز کنسول‌ها؛ پی‌اس۳ سمت چپ و پی‌اس۴ سمت راست", "bench_instruction": "روی خود کنسول یا دسته‌اش کلیک کن. انتخاب دستگاه، مرحلهٔ انتخاب کنسول سفارش را هم انجام می‌دهد.", "street_alt": "خیابان بارانی جلوی کافی‌نت زئوس", "market_alt": "پاساژ و بازار قطعات در شب", "story_amirali": "امیرعلی · صاحب زئوس", "story_maryam": "مریم · همکار زئوس", "story_shahin": "شاهین · دلال هارد", "story_rahim": "عمو رحیم · تعمیرکار قدیمی", "story_page": "صحنهٔ داستان", "story_next": "ادامهٔ گفت‌وگو", "story_replay": "دوباره خواندن گفت‌وگو", "story_bubble_hint": "برای ادامهٔ گفت‌وگو کلیک کن", "story_last_bubble": "پایان گفت‌وگو؛ تصمیم را با دکمهٔ جدا بگیر", "story_beat  "retry": "Try again", "server_error": "“502. Again. Just so you know, this isn't your fault.”", "server_online": "Finally connected. Use the customer section to work on the active order.", "local_notice": "All computer operations are simulated inside the game.", "usb_title": "The shop's test drive", "usb_label": "Drive status", "usb_unknown": "Not checked", "usb_ok": "Files are healthy", "usb_capacity": "Capacity", "usb_files": "Sample files", "usb_samples": "Photo, form and game save", "scan": "Check USB drive", "scan_done": "“The drive is healthy. One thing in this shop worked without a fight.”", "printer_eyebrow": "THE LASER PRINTER THAT NEVER RETIRED", "printer_title": "There's life in it yet.", "printer_copy": "The active order appears above. Test pages only check the printer; they do not complete orders.", "printer_status": "Device status", "ready": "Ready", "busy": "Working…", "paper_remaining": "Paper in the tray", "pages_printed": "Total sheets printed", "print_test": "Print a test page", "print_done": "“Printed. Slightly crooked, slightly faded. But printed.”", "paper_empty": "Out of paper. Pick up a stack from the desk.", "shelf_eyebrow": "GENERATIONS THAT HAVEN'T SWITCHED OFF", "shelf_title": "A shelf of memories and unfinished saves.", "shelf_copy": "Choose a test console and boot it. Future customer orders and service workflows will start here.", "console_select": "Select console", "console_checked": "Boot test complete", "console_pending": "Awaiting test", "console_test": "Test boot", "console_done": "“It boots. That unfinished game is still waiting. Like everything else on my list.”", "papers_eyebrow": "ALWAYS PLENTY OF PAPER, UNTIL YOU NEED IT", "papers_title": "The morning note", "papers_copy": "Customer paperwork and fresh sheets live here. Use the button below to refill the printer.", "memo_title": "BEFORE OPENING", "memo_1": "Check the computer and portal connection.", "memo_2": "Print a test page.", "memo_3": "Check the test drive and console.", "memo_4": "Deliver printed customer orders at the counter.", "refill": "Put 20 sheets in the tray", "refill_done": "“We have paper. Now the portal just needs to decide to work.”", "pause_eyebrow": "THE SHOP CAN WAIT A MOMENT", "pause_title": "Take a deep breath.", "pause_copy": "Operations and the tea cooldown are paused. Come back to the counter when you're ready.", "resume": "Resume game", "back_menu": "Back to the start menu", "guide_eyebrow": "A GUIDE TO THIS ROOM", "guide_title": "Everything is right here.", "guide_1_title": "Speech and orders have separate controls", "guide_1": "The bubble beside the portrait only advances speech. Accept and Deliver have separate buttons. Click scene equipment to work; H reveals its location.", "guide_2_title": "Difficulty and focus", "guide_2": "Above 50% stress, fumbles become possible. On Normal and Hard, errors surface at delivery: +25 stress points and a redo within the remaining patience. Easy gives immediate guidance. Tea and equipment reduce pressure.", "guide_3_title": "Three workdays, seven night chapters", "guide_3": "Five selected customers return across the first three days with a different job each day: 15 visits per run. Each has 60 seconds of patience. Then follow Shahin, Maryam and Uncle Rahim through choices on days 4–10.", "guide_4_title": "Save and play", "guide_4": "Keys 1–4: computer, printer, shelf and papers. File Manager has a simulated copy: C or Cover shows a vehicle form. Alt+Tab is usually reserved by your OS. City travel and pursuit are narrated choices in this version.", "storage_warning": "Browser storage is unavailable. Keep this page open to preserve your progress.", "fullscreen_failed": "Fullscreen wasn't enabled. The game works in this window too.", "room_alt": "An old internet café seen from behind the counter, with a computer, printer and tea", "settings": "Settings", "footer_complete": "5 customers per day · Ten story days · Two endings", "listen_customer": "Read the speech bubble beside the customer.", "click_next": "Click · next line", "mission_number": "Mission {count} of 3", "orders_done": "Delivered: {count} of 15", "customer_missions": "Customer missions", "customer_thanks": "“Thanks, that is sorted. Goodbye for now!”", "payment_line": "“Here are your {amount} tomans. I will get out of your way.”", "mission_delivered": "Order delivered. Payment has been added to your earnings.", "new_order": "A customer arrived with one order for this visit.", "next_order": "Say goodbye to the customer", "task_complete": "Step complete. The order card shows what comes next.", "choice_feedback": "{message}", "paper_required": "Paper required: {count} sheets", "send_request": "Submit order request", "run_task": "Perform this step", "customer": "Talk to customer", "name_man": "Mr. Rahimi", "name_woman": "Mrs. Naderi", "talk_to": "Talk to {name}", "order_number": "Order {count} of 3", "order_number_label": "At the counter / customer order", "earned": "Earned: {amount} tomans", "tomans": "{amount} tomans", "reward": "Payment on delivery: {amount} tomans", "income": "Shift earnings", "completed_orders": "Orders delivered", "customer_order": "Current order", "dialogue_man": "“Son, I need two readable copies of my pension certificate. They said this one was too faint. Here are all my papers. There's an electricity bill in there too. Don't send that to the pension office!”", "dialogue_woman": "“Dear, could you check my food subsidy? I've forgotten the password. I'm right here; please recover the account. Print me a receipt too. Last time it reached ninety-nine percent and said goodbye!”", "farewell_man": "“Wonderful, I can read it without my glasses! Here are thirty thousand tomans. Hopefully they won't ask for the original copy this time.”", "farewell_woman": "“Put the receipt with these papers. Here's forty-five thousand. They've told me to come back tomorrow so often, I've become a calendar!”", "objective_man_0": "Talk to Mr. Rahimi and accept his order.", "objective_man_1": "Find the pension certificate in the desk papers.", "objective_man_2": "At the printer, enhance the faded document.", "objective_man_3": "Print two copies of the pension certificate.", "objective_man_4": "Deliver both copies to Mr. Rahimi.", "objective_man_5": "Payment received. Call the next customer.", "objective_woman_0": "Talk to Mrs. Naderi and accept her order.", "objective_woman_1": "Recover the demo account on the computer.", "objective_woman_2": "Retry the subsidy query until it succeeds.", "objective_woman_3": "Print one subsidy inquiry receipt.", "objective_woman_4": "Deliver the receipt to Mrs. Naderi.", "objective_woman_5": "Payment received. View the shift report.", "accept_order": "Accept order", "deliver_order": "Deliver order and collect payment", "next_customer": "Next customer, please!", "finish_shift": "Finish shift and view earnings", "go_papers": "Go to the desk papers", "go_printer": "Go to the printer", "go_monitor": "Go to the computer", "go_customer": "Return to the customer", "correct_document": "Pension certificate / correct document", "wrong_document_choice": "Electricity bill / wrong paper", "document_sample": "PENSION CERTIFICATE — DEMO", "enhance_document": "Enhance contrast and prepare copies", "keep_faded": "The faded version looks fine!", "recovery_consent": "The customer is present for recovery. All details are fictional; do not enter real passwords, phone numbers or personal information.", "recover_account": "Recover demo account with customer present", "submit_order": "Send subsidy inquiry again", "order_attempts": "Attempts completed: {count} / 3", "two_copies": "Two readable copies are ready. Paper required: 2 sheets.", "receipt_ready": "Inquiry successful. Print one receipt with fictional reference DEMO-024.", "print_order": "Print customer order", "get_paper": "Not enough paper; go to the desk to refill", "order_accepted": "Accepted. The order card shows the next step. Let's get to work.", "wrong_document": "That's an electricity bill! It might explain the lights, but pick the pension certificate.", "document_verified": "Found the certificate. Now the printer needs to turn this faint shadow into actual words.", "faded_warning": "That's the version they rejected. Increase the contrast before we waste paper.", "contrast_ready": "Readable at last. Two copies are ready to print for Mr. Rahimi.", "order_paper_empty": "Not enough paper. Refill the printer from the desk papers.", "printing_order": "The printer is moving. Nobody look at it too intensely.", "order_print_done": "All steps complete. Close the window and use Deliver order.", "recovery_started": "Recovering the demo account. We can't blame the forgotten password after this.", "recovery_done": "Account recovered. Now the subsidy inquiry. Here comes the difficult part.", "order_502": "Error 502. The server did not answer. Retry the request.", "order_99": "Ninety-nine percent, then disconnected. Try again.", "order_portal_done": "Finally, an answer! Print the receipt before the server changes its mind.", "thanks_man": "Two copies delivered and thirty thousand tomans earned. Next customer is waiting.", "thanks_woman": "Receipt delivered. Forty-five thousand tomans received. We survived this shift.", "arrival_woman": "Mrs. Naderi arrives with a card and plenty of questions. Talk to her first.", "shift_done": "The secret of Zeus", "all_done": "The shift has ended.", "summary_copy": "Your ending depends on delivered orders, lost visits and inspection risk.", "new_shift": "New story from day one", "difficulty_question": "How much patience do you have today? Choose difficulty.", "difficulty_choose": "Select a difficulty before starting the shift.", "easy": "Easy", "normal": "Normal", "hard": "Hard", "difficulty_easy": "2 steps, immediate mistake guidance, first-attempt portals. Every customer waits 60 seconds.", "difficulty_normal": "3 steps; errors stay hidden until delivery. A rejected order adds 25 stress points and must be ence!", "game_over_copy": "The keyboard paid the price. Stress reached 100% and ended the shift. Start a fresh shift to try again.", "code_prompt": "Fictional reference; verified at delivery:", "code_label": "Four-digit task reference", "check_reference": "Record code on form", "code_wrong": "The code does not match. Compare it with the reference again.", "code_checked": "Reference checked. The step is ready.", "code_needed": "On Hard, enter and record the reference code first.", "option_hint": "Easy hint: {label}", "customer_timeout": "The minute is up. Order lost; the customer leaves without paying.", "stress_rework": "Incorrect delivery added exactly 25 stress points.", "order_rejected": "Customer rejected the order: +25 stress points. Redo it from the first step; patience keeps counting down.", "code_recorded": "Code recorded. Continue the order.", "wrong_setup": "Easy guidance: settings do not match the request yet. Check the device instructions.", "refresh_sent": "502… refresh again.", "refresh_button": "F5 / Refresh", "refresh_progress": "Refreshes: {count} / {total}", "setting_saved": "Setting recorded.", "patience": "Customer patience", "patience_left": "{seconds}s remaining", "patience_rule": "30s: anger and +15 stress · 60s: leaves unpaid", "deadline_left": "Special work deadline: {seconds}s", "gateway_left": "Gateway session: {seconds}s; customer patience is separate.", "photo_crop": "Photo crop", "photo_background": "Background", "photo_size": "Output size", "crop_3x4": "3×4 frame", "crop_square": "Square selfie", "background_gray": "Light gray", "background_filter": "Instagram filter", "size_45": "45 KB", "size_80": "80 KB", "export_photo": "Export photo", "jam_status": "Roller status", "roller_jammed": "Jammed", "roller_free": "Released", "release_roller": "Open cover and release roller", "test_roller": "Test roller", "hotspot_on": "Hotspot connected", "hotspot_off": "Hotspot disconnected", "signal_angle": "Phone angle by the window", "angle_15": "15° / weak", "angle_45": "45° / full signal", "angle_80": "80° / no signal", "receive_sms": "Request demo SMS", "quarantine_file": "Sample threat {count}", "isolated": "Isolated", "not_isolated": "On USB", "apply_quarantine": "Apply quarantine", "upgrades": "Equipment upgrades", "upgrades_title": "Speed has a price.", "upgrades_copy": "Spend successful-order income. Each level removes 20% of base job time; three levels cut time by 60%. This window pauses gameplay.", "cash": "Spendable balance", "total_spent": "Upgrade spending", "upgrade_cpu": "Computer and SSD", "upgrade_printer": "Printer and cartridge", "upgrade_router": "Router and connection", "upgrade_cpu_copy": "Faster scans, photos, quarantine and portal requests. Fewer F5 presses; one fewer portal failure from level 2.", "upgrade_printer_copy": "Faster printing and jam maintenance.", "upgrade_router_copy": "Shorter requests, fewer F5 presses, and one fewer portal failure from level 2.", "upgrade_level": "Level {level} of 3 · {percent}% shorter jobs", "buy_upgrade": "Upgrade · {amount} tomans", "upgrade_max": "Maximum level", "upgrade_poor": "Not enough money.", "upgrade_bought": "Upgrade installed. Future work will finish faster.", "good_ending": "Good ending — The lights of Zeus", "bad_ending": "Bad ending — Error 502, permanent disconnection", "good_ending_copy": "You did not become rich, but Zeus stayed open and you kept your honour.", "bad_ending_copy": "03:00 AM. Rain, shattered glass and Zeus going dark.", "ending_rule": "Good ending: end Shahin’s deal, never hand hidden data to the network, and erase it with Uncle Rahim. Delivered data cannot be retrieved. 100% stress also ends badly.", "missed_orders": "Lost orders", "inspection_risk": "Inspection risk", "rejected_orders": "Rejected deliveries", "read_reaction": "Continue customer speech", "no_payment": "“No payment for this one. You wasted my whole minute, engineer!”", "tea_copy": "Recover 18 stress on Easy, 14 on Normal or 11 on Hard; once every 25 seconds.", "drink_tea": "Drink tea", "day": "Day report", "planner": "Daybook and customers", "day_number": "Day {day} of 10", "day_progress": "Day {day} · {count} of 5 orders completed", "day_complete": "Day complete. The report and next day are ready.", "day_start": "Open shop for the day", "day_board": "Daybook", "day_break_copy": "Time is paused here. Customers arrive when you open the shop. At the start of days two and three, stress falls by 20 points and paper is topped up to at least 20 sheets.", "day_obstacle": "Today’s obstacle", "last_night": "Last night’s note", "campaign_premise": "The secret of Zeus", "story_so_far": "The story so far", "day_rules": "Each run selects five customers, one per group. The same five return on days one, two and three with their first, second and third missions. Arrival order changes daily.", "category_neighbours": "Neighbours and retirees", "category_gaming": "Gaming and consoles", "category_education": "School and entrance exams", "category_urgent": "Urgent work and business", "category_sensitive": "Files and sensitive requests", "mission_pending": "Pending", "mission_done": "Delivered", "mission_failed": "Missed", "mission_current": "Current order", "daily_missions": "Daily missions", "stress_overnight": "Overnight rest: stress reduced by 20 points", "app_browser": "Service browser", "app_files": "File manager", "app_photo": "Photo editor", "app_scanner": "Document scanner", "app_accounts": "Accounts", "app_planner": "Customer daybook", "open_required_app": "Open {app}", "app_needed": "This step is handled in {app}.", "desktop_status": "Zeus local workstation / six apps / no external connection", "desktop_active": "Active order: {name}", "browser_idle": "Portal forms, appointments and tracking open here.", "files_idle": "File lists, delivery bundles and quarantine appear here.", "photo_idle": "Prepare customer photos here: crop, background and output size.", "scanner_idle": "Scan documents and configure quality and file format here.", "accounts_idle": "Review customer invoices and cumulative income here.", "form_submit": "Submit prepared form", "files_submit": "Build selected file bundle", "files_selected": "Selected: {count}", "file_ready": "In bundle", "file_available": "Select file", "invoice_total": "Final total (tomans)", "invoice_submit": "Record invoice", "invoice_hint": "Easy-mode total: {amount} tomans", "form_hint": "Easy-mode guide: {label}", "records_notice": "This daybook shows each customer’s three daily orders. Reading it pauses time.", "campaign_income": "Zeus till", "future_epilogue": "The fate of Zeus", "cash_scope": "This till shows this playthrough’s order income and chosen deals.", "business_goal": "Keep the lights of Zeus on", "overnight_summary": "Report through the previous day", "return_day_report": "Return to the day opening", "seizure_message": "System seized by judicial order", "night_progress": "Day {day} · Night story chapter", "story_choice": "Amirali’s decision", "story_consequence": "Previous decision", "night_mode": "Night chapter / Story and choices", "copy_title": "Shadow hub / 320 GB drive", "copy_intro": "An 8-second fictional copy; an inspector approaches. Press C or Cover to show the vehicle form, then resume. Once per day, 15,000 tomans. No real files are read or transferred.", "copy_start": "Start simulated copy", "copy_cover": "Cover with vehicle form · C", "copy_resume": "Return to copy · C", "copy_vehicle": "Vehicle registration / White / West branch", "copy_running": "Resident Evil / Copying…", "copy_covered": "The vehicle form is showing; copying is paused.", "copy_alert": "Inspector at the window! Show the vehicle form quickly.", "copy_spotted": "Inspector saw the window: +12 stress points and +1 risk.", "copy_done": "Simulated copy complete; earned 15,000 tomans.", "copy_daily_done": "Today’s simulated copy is complete.", "stress_inspector": "The inspector seeing the window increased pressure.", "tutorial": "Learn and practise", "tutorial_title": "Your first order at Zeus", "tutorial_safe": "Practice is separate from your story. Take your time; your campaign save and money stay intact.", "tutorial_step": "Lesson {step} of {total}", "tutorial_begin": "Start hands-on practice", "tutorial_exit": "Back to menu", "tutorial_next": "Next lesson", "tutorial_again": "Practise again", "tutorial_wrong": "You can retry in practice. Read this lesson’s instruction.", "tutorial_correct": "Correct! Now try the next step.", "tutorial_talk": "Click the customer’s speech", "tutorial_print": "Print two practice copies", "tutorial_wait30": "Show what happens at 30 seconds", "tutorial_wait60": "Now show 60 seconds", "tutorial_apps_hint": "Open all six apps to learn what they do.", "tutorial_finish": "Finished! Return to difficulty selection", "tutorial_unread": "Advance the customer’s speech twice first. This does not accept their order.", "developer": "Developer mode", "dev_on": "Developer ON · N / د", "dev_skip": "Skip customer", "dev_question": "Should this customer leave satisfied?", "dev_copy": "Satisfied records a delivery and base pay. Unhappy records a lost order without pay. Both advance to the next visit.", "dev_satisfied": "Yes, satisfied", "dev_unhappy": "No, unhappy", "dev_cancel": "Cancel skip", "dev_skip_happy": "Customer left satisfied; base pay recorded.", "dev_skip_unhappy": "Customer left unhappy; no payment recorded.", "dev_unavailable": "There is no unfinished customer to skip right now.", "dev_hint": "N or د toggles developer mode. Skip always asks about customer satisfaction first.", "dev_disabled": "Developer mode disabled.", "tutorial_0_title": "Welcome behind the counter", "tutorial_0_copy": "Practise a real order step by step: speech, accepting, document selection, printer settings, printing and delivery. Then learn tea, patience, upgrades and computer apps.", "tutorial_1_title": "The bubble is only for speech", "tutorial_1_copy": "The bubble appears beside the portrait. Click Mr. Rahimi’s speech twice. This does not accept the order or open equipment.", "tutorial_2_title": "Now accept the order", "tutorial_2_copy": "The customer wants two readable pension-certificate copies. Press the separate Accept order button to begin.", "tutorial_3_title": "Find the correct document", "tutorial_3_copy": "In the game click the desk papers or press 4. Here, select the pension certificate; the electricity bill is unrelated.", "tutorial_4_title": "Prepare the printer", "tutorial_4_copy": "In the game click the printer or press 2. This document is faded; increase contrast before printing.", "tutorial_5_title": "Printing uses time and paper", "tutorial_5_copy": "Print two copies and watch the progress bar. Deliver only after the job finishes. Refill paper from the desk documents when needed.", "tutorial_6_title": "Payment comes at delivery", "tutorial_6_copy": "Close the equipment panel in the game and press Deliver order. Do that here: earn 30,000 tomans and ease stress. An order only pays once.", "tutorial_7_title": "Tea and the 50% threshold", "tutorial_7_copy": "Practice stress is set to 60%. Above 50% involuntary fumbles become possible; 100% breaks the keyboard. Click the tea glass: Normal removes 14 stress points. Tea needs 25 seconds between sips.", "tutorial_8_title": "Customers wait one minute", "tutorial_8_copy": "Patience starts at arrival. These buttons fast-forward only practice: at 30 seconds a taunt and +15 stress; at 60 an unpaid departure. Speech and task changes do not reset patience.", "tutorial_9_title": "Spend earnings on speed", "tutorial_9_copy": "You have 30,000 practice tomans. Buy the first computer upgrade: jobs take 20% less time. The printer also has three levels. The upgrade screen pauses time.", "tutorial_10_title": "Six computer apps", "tutorial_10_copy": "Click the computer or press 1. Pick the app for the current order. Open all six apps, then finish the lesson.", "tutorial_11_title": "You are ready for the story", "tutorial_11_copy": "   function trainingAction(id){
    if(!training)return;const n=training.step,r=training.room;
    if(id==='exit'){closePanel();$('open-tutorial').focus();return;}
    if(id==='restart'){beginTraining();return;}
    if(id==='language'){language=language==='fa'?'en':'fa';translate();save();return;}
    if(id==='talk'&&n===1){r.dialogueNext();renderPanel();return;}
    if(id==='next'&&([0,1,6,7,8,9,10].includes(n))){if([6,7,9].includes(n)&&!training.done||n===1&&r.state.order.line<2||n===8&&training.waitStage<2||n===10&&training.apps.length<6)return;advanceTraining();return;}
    if(id==='accept'&&n===2){r.orderAction('accept');advanceTraining();return;}
    if(id.startsWith('choice:')&&[3,4].includes(n)){const value=id.slice(7);if(value===r.task().correct){r.orderAction('choose:'+value);advanceTraining();}else{training.notice='tutorial_wrong';renderPanel();}return;}
    if(id==='print'&&n===5&&!r.job){r.orderAction('work');renderPanel();return;}
    if(id==='deliver'&&n===6){if(!training.done&&r.orderAction('deliver')==='mission_delivered'){training.done=true;training.notice='tutorial_correct';renderPanel();}return;}
    if(id==='tea'&&n===7&&!training.done){r.tea();training.done=true;training.notice='tutorial_correct';renderPanel();return;}
    if((id==='wait30'&&n===8&&training.waitStage===0)||(id==='wait60'&&n===8&&training.waitStage===1)){r.tick(30);training.waitStage++;renderPanel();return;}
    if(id==='upgrade'&&n===9){if(!training.done&&r.purchase('cpu')==='upgrade_bought'){training.done=true;training.notice='upgrade_bought';renderPanel();}return;}
    if(id.startsWith('app:')&&n===10&&RoomCore.APPS.includes(id.slice(4))){training.app=id.slice(4);if(!training.apps.includes(training.app))training.apps.push(training.app);renderPanel();}
  }
  function gameoverHTML(){return heading('stress','game_over')+'<div class="keyboard-break" aria-hidden="true">⌨ ✕</div><p class="gameover-copy">'+t('game_over_copy')+'</p>'+row('income',text('tomans',{amount:room.state.order.earnings}))+row('slips_total',num(room.state.slips))+action('new-shift','new_shift');}
  function guideHTML(){return heading('guide_eyebrow','guide_title')+[1,2,3,4].map(i=>`<div class="guide-item"><h3>${t('guide_'+i+'_title')}</h3><p>${t('guide_'+i)}</p></div>`).join('');}
  function renderPanel(){
    if(!panel)return;
    if(isStoryPage())storyPosition();
    const key=JSON.stringify([panel,language,computerTab,room.state,room.job?.kind,training,storyCursor]);if(key===panelKey)return;
    const invoiceValue=$('invoice-total')?.value,referenceValue=$('reference-input')?.value,referenceVisit=customerId()+':'+room.state.order.mission+':'+room.state.order.step;
    const focus=document.activeElement;const focusAction=focus?.dataset?.action;const hadFocus=$('panel-content').contains(focus);
    panelKey=key;
    $('panel').dataset.view=panel;
    $('panel').classList.toggle('story-screen',isStoryPage());document.body.classList.toggle('story-page-active',isStoryPage());
    $('close-panel').disabled=isStoryPage();
    $('panel-caption').textContent=text(panel==='pause'?'pause':panel==='guide'?'guide':panel);
    $('panel-content').innerHTML=(['pause','guide','upgrades','ending','gameover','day','planner','tutorial','developer'].includes(panel)?'':panelPatienceHTML()+customerReactionHTML())+(panel==='tutorial'?trainingHTML():panel==='developer'?developerHTML():panel==='day'?chapterHTML():panel==='planner'?plannerHTML():panel==='ending'||panel==='gameover'?endingHTML():panel==='upgrades'?upgradesHTML():panel==='tools'?toolsHTML():panel==='customer'?customerHTML():panel==='monitor'?monitorHTML():panel==='printer'?orderStation('printer')+printerHTML():panel==='shelf'?shelfHTML()+orderStation('shelf'):panel==='papers'?orderStation('papers')+papersHTML():panel==='guide'?guideHTML():heading('pause_eyebrow','pause_title','pause_copy')+`<div class="panel-buttons">${action('resume','resume')}${action('menu','back_menu',false,true)}</div>`);
    if(canSkipCustomer()&&!['tutorial','developer','ending','gameover'].includes(panel))$('panel-content').innerHTML='<div class="dev-panel-controls">'+action('dev-ask','dev_skip',false,true)+'</div>'+$('panel-content').innerHTML;
    if(referenceValue!==undefined&&$('reference-input')&&referenceVisit===customerId()+':'+room.state.order.mission+':'+room.state.order.step&&focus?.id==='reference-input')$('reference-input').value=referenceValue;
    if(invoiceValue!==undefined&&$('invoice-total')&&referenceVisit===customerId()+':'+room.state.order.mission+':'+room.state.order.step&&focus?.id==='invoice-total')$('invoice-total').value=invoiceValue;
    if(hadFocus&&focus?.id==='invoice-total'&&$('invoice-total'))$('invoice-total').focus({preventScroll:true});
    if(hadFocus&&focus?.id==='reference-input'&&$('reference-input'))$('reference-input').focus({preventScroll:true});
    if(hadFocus&&focusAction){const next=$('panel-content').querySelector(`[data-action="${focusAction}"]:not(:disabled)`);if(next)next.focus({preventScroll:true});}
    renderHUD();
  }
  function openPanel(which,restoring=false){
    if(!room.started&&which!=='tutorial')return;
    if(which==='planner'&&panel!=='planner'&&!restoring)plannerReturn=room.state.dayBreak?'day':panel;
    else if(panel==='planner'&&which!=='developer')plannerReturn=null;
    panel=which;panelKey='';room.paused=['pause','guide','upgrades','day','planner','developer','tutorial'].includes(which);updateAudio();
    renderPanel();if(!$('panel').open)$('panel').showModal();
    const focus=isStoryPage()?$('panel-title'):$('close-panel');if(isStoryPage())focus.tabIndex=-1;focus.focus({preventScroll:true});
  }
  function closePanel(force=false){
    if(!force&&panel==='planner'){const previous=plannerReturn;plannerReturn=null;if(previous){openPanel(previous);save();return;}}
    if(!force&&room.started&&room.state.dayBreak&&!room.state.ending&&panel!=='day'){openPanel('day');save();return;}
    plannerReturn=null;
    const previous=panel;if(previous==='tutorial')training=null;panel=null;panelKey='';$('panel').close();
    $('panel').classList.remove('story-screen');document.body.classList.remove('story-page-active');
    if(['pause','guide','upgrades','day','planner','developer','tutorial'].includes(previous)){room.paused=false;updateAudio();}
    renderHUD();save();
  }
  function visit(place){
    if(!room.ready())return;room.visit(place);beep();
    if(place==='tea'){
      if(room.tea()){say('tea_drink');beep('tea');}else say('tea_wait',{seconds:Math.ceil(room.state.teaCooldown)});
      renderHUD();save();return;
    }
    openPanel(place);save();
  }
  function beginGame(){
    if(!room.start()){renderDifficulty();return;}startAudio();$('intro').hidden=true;$('shop-identity').hidden=false;$('pause').hidden=false;$('hud').hidden=false;
    $('hotspots').inert=false;showHints=false;document.body.classList.remove('show-hints');
    $('world').tabIndex=-1;$('world').focus({preventScroll:true});say('welcome');translate();save();if(room.state.ending)openPanel('ending');else if(room.state.dayBreak)openPanel('day');
  }
  function backMenu(){
    closePanel(true);room.started=false;room.paused=false;updateAudio();
    eventTime=0;$('game-event').hidden=true;
    $('intro').hidden=false;$('shop-identity').hidden=true;$('pause').hidden=true;$('hud').hidden=true;$('speech').hidden=true;$('hotspots').inert=true;
    document.body.classList.remove('show-hints');$('start').focus();save();
    renderScene();renderCustomer();renderDifficulty();
  }
  $('open-tutorial').addEventListener('click',beginTraining);
  $('dev-skip').addEventListener('click',askDeveloperSkip);
  $('start').addEventListener('click',beginGame);
  document.querySelectorAll('[data-difficulty]').forEach(el=>el.addEventListener('click',()=>{room.setDifficulty(el.dataset.difficulty);renderDifficulty();save();}));
  function newShift(){training=null;devReturnPanel=null;storyCursor=null;closePanel(true);room=new RoomCore.Room();customerRenderKey='';taskFeedback=null;backMenu();translate();save();}
  $('restart-shift').addEventListener('click',newShift);
  $('accept-order').addEventListener('click',()=>performOrder('accept'));
  $('deliver-order').addEventListener('click',()=>performOrder('deliver'));
  $('leave-customer').addEventListener('click',()=>performOrder('next'));
  $('day-board').addEventListener('click',()=>openPanel(room.state.dayBreak?'day':'planner'));
  $('open-tools').addEventListener('click',()=>openPanel('tools'));
  $('open-upgrades').addEventListener('click',()=>openPanel('upgrades'));
  function useUtility(id){if(id==='tea'){visit('tea');renderPanel();return;}const result=room.utility(id);if(result){say(result);announce(result);beep();}renderPanel();renderHUD();save();}
  $('copy-cover').addEventListener('click',coverCopy);
  $('take-breath').addEventListener('click',()=>useUtility('breath'));
  $('customer-sprite').addEventListener('click',advanceDialogue);
  $('scene-dialogue').addEventListener('click',advanceDialogue);
  $('order-tracker').addEventListener('click',()=>openPanel('customer'));
  document.querySelectorAll('[data-place]').forEach(element=>element.addEventListener('click',()=>visit(element.dataset.place)));
  $('language').addEventListener('click',()=>{language=language==='fa'?'en':'fa';translate();save();});
  $('audio').addEventListener('click',()=>{sound=!sound;if(sound)startAudio();updateAudio();translate();save();});
  $('motion').addEventListener('click',()=>{motion=!motion;translate();save();});
  $('pause').addEventListener('click',()=>openPanel('pause'));
  $('guide').addEventListener('click',()=>openPanel('guide'));
  function toggleHints(){showHints=!showHints;document.body.classList.toggle('show-hints',showHints);$('show-hints').setAttribute('aria-pressed',String(showHints));}
  $('show-hints').addEventListener('click',toggleHints);
  $('close-panel').addEventListener('click',()=>{if(panel==='developer')cancelDeveloperSkip();else if(!isStoryPage())closePanel();});
  $('panel').addEventListener('cancel',event=>{event.preventDefault();if(panel==='developer')cancelDeveloperSkip();else if(!isStoryPage())closePanel();});
  $('panel').addEventListener('click',event=>{if(event.target===$('panel')&&!isStoryPage()){const r=$('panel').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom){if(panel==='developer')cancelDeveloperSkip();else closePanel();}}});
  $('panel-content').addEventListener('input',event=>{if(event.target.id==='invoice-total'){const value=digits(event.target.value).replace(/\D/g,'');room.orderAction('set:total:'+value);save();}});
  $('panel-content').addEventListener('click',event=>{
    const control=event.target.closest('button');if(!control||control.disabled)return;
    if(control.dataset.model){pickConsole(control.dataset.model);return;}
    const action=control.dataset.action;
    if(action==='story-next'||action==='story-replay'){advanceStory(action==='story-replay');return;}
    if(action==='story-language'){language=language==='fa'?'en':'fa';translate();save();return;}
    if(action?.startsWith('console-pick:')){pickConsole(action.slice(13));return;}
    if(action?.startsWith('tutorial-')){trainingAction(action.slice(9));return;}
    if(action==='dev-ask'){askDeveloperSkip();return;}
    if(action==='dev-cancel'){cancelDeveloperSkip();return;}
    if(action==='dev-satisfied'||action==='dev-unhappy'){const result=room.developerSkip(action==='dev-satisfied');if(result){devReturnPanel=null;closePanel();announce(result);renderHUD();save();}return;}
    if(action?.startsWith('plot-')){if(room.chooseStory(action.slice(5))){renderHUD();save();openPanel(room.state.ending?'ending':'day');}return;}
    if(action==='copy-start'){if(room.beginCopy()){renderPanel();renderHUD();save();}return;}
    if(action==='copy-toggle'){coverCopy();return;}
    if(action==='begin-day'){closePanel(true);if(room.startDay()){renderHUD();save();say('welcome');}return;}
    if(action==='invoice-work'){const value=digits($('invoice-total')?.value||'').replace(/\D/g,'');room.orderAction('set:total:'+value);performOrder('work');return;}
    if(action==='new-shift'){newShift();return;}
    if(action==='dismiss-reaction'){room.dialogueNext();renderPanel();renderHUD();save();return;}
    if(action?.startsWith('buy-')){const result=room.purchase(action.slice(4));if(result)announce(result);renderPanel();renderHUD();save();return;}
    if(action?.startsWith('utility-')){useUtility(action.slice(8));return;}
    if(action?.startsWith('goto-')){openPanel(action.slice(5));return;}
    if(action==='order-check'){const digits=($('reference-input')?.value||'').replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632));performOrder('check:'+digits);return;}
    if(action?.startsWith('order-')){performOrder(action.slice(6));return;}
    if(action?.startsWith('tab-')&&RoomCore.APPS.includes(action.slice(4))){const app=action.slice(4);if(app==='planner'){openPanel('planner');return;}computerTab=app;renderPanel();return;}
    if(['retry','print','scan','console'].includes(action)){
      if(room.begin(action)){beep(action==='print'?'print':'click');if(action==='print')$('printer-paper').classList.add('printing');}
      renderPanel();save();return;
    }
    if(action==='refill'){room.refill();say('refill_done');renderPanel();renderHUD();save();}
    if(action==='resume')closePanel();
    if(action==='menu')backMenu();
  });
  $('fullscreen').addEventListener('click',async()=>{
    try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
    catch(_){say('fullscreen_failed');}
  });
  document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=text(document.fullscreenElement?'exit_fullscreen':'fullscreen');});
  document.addEventListener('keydown',event=>{
    const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||['invoice-total','reference-input'].includes(document.activeElement?.id);
    if(!event.repeat&&!event.ctrlKey&&!event.metaKey&&!typing&&room.ready()&&room.state.plot.transfer.active&&((event.code==='KeyC'&&!event.altKey)||(event.code==='Tab'&&event.altKey))){event.preventDefault();coverCopy();return;}
    if(event.repeat||event.ctrlKey||event.altKey||event.metaKey)return;
    if(room.started&&!typing&&(event.code==='KeyN'||event.key==='د'||event.key?.toLowerCase()==='n')){event.preventDefault();toggleDeveloper();return;}
    if(!room.started){if(event.key==='Enter'&&document.activeElement===document.body){event.preventDefault();beginGame();}return;}
    if(event.code==='F5'&&room.ready()&&room.task()?.kind==='refresh'&&(!panel||panel==='monitor')){event.preventDefault();performOrder('refresh');return;}
    if($('panel').open)return;
    if(event.key==='Escape'){event.preventDefault();openPanel('pause');return;}
    if(event.code==='KeyH'){event.preventDefault();toggleHints();return;}
    const index=['Digit1','Digit2','Digit3','Digit4'].indexOf(event.code);
    if(index>=0){event.preventDefault();visit(RoomCore.PLACES[index]);}
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&room.started&&!room.paused){if(panel)closePanel();openPanel('pause');save();}
    updateAudio();lastTime=performance.now();
  });
  window.addEventListener('pagehide',save);
  function frame(now){
    const dt=Math.min(.25,Math.max(0,(now-lastTime)/1000));lastTime=now;
    if(training?.room.job&&panel==='tutorial'&&!document.hidden){training.room.tick(dt);const j=training.room.job;if($('training-progress'))$('training-progress').style.width=(j?j.elapsed/j.duration*100:100)+'%';if($('training-meter'))$('training-meter').setAttribute('aria-valuenow',String(j?Math.floor(j.elapsed/j.duration*100):100));if(!j)advanceTraining();}
    const result=room.tick(dt);if(result){$('printer-paper').classList.remove('printing');say(result);announce(result);beep(result==='server_error'||result.startsWith('slip_')?'error':'click');renderPanel();renderHUD();save();if(room.state.ending)openPanel('ending');else if(room.state.dayBreak)openPanel('day');}
    if(room.started&&!room.paused&&speechTime>0){speechTime-=dt;if(speechTime<=0)$('speech').hidden=true;}
    elapsed+=dt;if(elapsed>.1){elapsed=0;renderHUD();}
    if(room.ready()&&eventTime>0){eventTime-=dt;if(eventTime<=0)$('game-event').hidden=true;}
    if(room.ready()){autosaveTime+=dt;if(autosaveTime>=5){autosaveTime=0;save();}}
    if(panel==='tools'&&room.ready()){toolsTime+=dt;if(toolsTime>=1){toolsTime=0;renderPanel();}}
    if(room.ready()&&room.state.devices.radio&&sound){radioClock+=dt;if(radioClock>=.8){radioClock=0;playRadioNote();}}
    requestAnimationFrame(frame);
  }
  document.documentElement.style.setProperty('--scene-image',`url("${$('shop-image').src}")`);
  translate();$('save-warning').hidden=storageOK;requestAnimationFrame(frame);
})();
</script>
</body>
